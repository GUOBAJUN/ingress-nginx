name: Build fork images

on:
  workflow_dispatch:
    inputs:
      nginx_tag:
        description: "Tag for the nginx image"
        required: true
        default: "v2.3.0-1.30.6"
      controller_tag:
        description: "Tag for the controller image"
        required: true
        default: "v1.15.0-nginx1.30.6"
  push:
    branches:
      - upgrade-nginx
    paths:
      - "images/nginx/rootfs/**"
      - "rootfs/**"
      - "build/**"
      - "GOLANG_VERSION"

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-images-${{ github.ref }}
  cancel-in-progress: false

env:
  NGINX_TAG: ${{ github.event.inputs.nginx_tag || 'v2.3.0-1.30.6' }}
  CONTROLLER_TAG: ${{ github.event.inputs.controller_tag || 'v1.15.0-nginx1.30.6' }}

jobs:
  nginx:
    name: nginx ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image prefix
        id: meta
        run: echo "prefix=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The nginx build installs ~360 Alpine packages, OTel, ModSecurity and
      # nginx itself. GitHub's default runner disk is too small.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push nginx (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: images/nginx/rootfs
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            USE_GIT_SUBMODULES=1
            APK_MIRROR=
          tags: |
            ghcr.io/${{ steps.meta.outputs.prefix }}/nginx:${{ env.NGINX_TAG }}-${{ matrix.arch }}
          cache-from: type=gha,scope=nginx-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=nginx-${{ matrix.arch }}

  merge-nginx:
    name: merge nginx index
    needs: nginx
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image: ${{ steps.merge.outputs.image }}
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - name: Compute image prefix
        id: meta
        run: echo "prefix=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge nginx multi-arch index
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${{ steps.meta.outputs.prefix }}/nginx:${{ env.NGINX_TAG }}"
          docker buildx imagetools create -t "$image" \
            "$image-amd64" \
            "$image-arm64"
          docker buildx imagetools inspect "$image" | grep -q 'linux/amd64'
          docker buildx imagetools inspect "$image" | grep -q 'linux/arm64'
          digest=$(docker buildx imagetools inspect "$image" | awk '/^Digest:/ {print $2; exit}')
          test -n "$digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## nginx multi-arch image"
            echo ''
            echo '```'
            echo "$image@$digest"
            echo '```'
            echo ''
            echo "Architectures: linux/amd64, linux/arm64"
            echo "Use this index digest for NGINX_BASE."
          } >> "$GITHUB_STEP_SUMMARY"

  controller:
    name: controller ${{ matrix.arch }}
    needs: merge-nginx
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image prefix
        id: meta
        run: echo "prefix=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build controller binaries (${{ matrix.arch }})
        env:
          CONTROLLER_TAG: ${{ env.CONTROLLER_TAG }}
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -e CGO_ENABLED=0 \
            -e GOFLAGS=-buildvcs=false \
            -e PKG=k8s.io/ingress-nginx \
            -e ARCH=${{ matrix.arch }} \
            -e COMMIT_SHA="${GITHUB_SHA}" \
            -e REPO_INFO="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -e TAG="${CONTROLLER_TAG}" \
            public.ecr.aws/docker/library/golang:1.26-alpine3.23 \
            sh -c 'apk add --no-cache bash >/dev/null && bash build/build.sh'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push controller (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: rootfs
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=ghcr.io/${{ steps.meta.outputs.prefix }}/nginx@${{ needs.merge-nginx.outputs.digest }}
            VERSION=${{ env.CONTROLLER_TAG }}
            TARGETARCH=${{ matrix.arch }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_ID=${{ github.run_id }}
            APK_MIRROR=
          tags: |
            ghcr.io/${{ steps.meta.outputs.prefix }}/controller:${{ env.CONTROLLER_TAG }}-${{ matrix.arch }}
          cache-from: type=gha,scope=controller-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=controller-${{ matrix.arch }}

  merge-controller:
    name: merge controller index
    needs: controller
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image: ${{ steps.merge.outputs.image }}
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - name: Compute image prefix
        id: meta
        run: echo "prefix=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge controller multi-arch index
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${{ steps.meta.outputs.prefix }}/controller:${{ env.CONTROLLER_TAG }}"
          docker buildx imagetools create -t "$image" \
            "$image-amd64" \
            "$image-arm64"
          docker buildx imagetools inspect "$image" | grep -q 'linux/amd64'
          docker buildx imagetools inspect "$image" | grep -q 'linux/arm64'
          digest=$(docker buildx imagetools inspect "$image" | awk '/^Digest:/ {print $2; exit}')
          test -n "$digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## controller multi-arch image"
            echo ''
            echo '```'
            echo "$image@$digest"
            echo '```'
            echo ''
            echo "Architectures: linux/amd64, linux/arm64"
            echo "Use this index digest in the Helm chart."
          } >> "$GITHUB_STEP_SUMMARY"
